<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модуль 4 - Керування виконанням програми</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8fb;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            color: #222;
            margin-bottom: 30px;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        a {
            display: block;
            padding: 14px 18px;
            text-decoration: none;
            color: white;
            background-color: #007BFF;
            border-radius: 6px;
            font-size: 18px;
            transition: background-color 0.3s, transform 0.2s;
        }

        a:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        .back-link {
            margin-top: 25px;
            background-color: #6c757d;
        }

        .back-link:hover {
            background-color: #545b62;
        }
    </style>
</head>
