<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.1 Алфавіт та лексеми мов C/C++</title>

    <link rel="stylesheet" href="bot-design.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8fb;
            color: #222;
            margin: 0;
            padding: 0;
        }

        .page-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .top-panel {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 28px;
            line-height: 1.3;
            margin: 0;
            color: #1f2937;
        }

        .back-button {
            display: inline-block;
            padding: 10px 16px;
            background-color: #6c757d;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            transition: background-color 0.2s, transform 0.2s;
            white-space: nowrap;
        }

        .back-button:hover {
            background-color: #545b62;
            transform: translateY(-1px);
        }

        .lesson-nav {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .lesson-nav button {
            min-width: 110px;
            font-size: 16px;
            font-weight: 600;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        .lesson-nav button:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }

        .lesson-nav button.active {
            background-color: #198754;
        }

        .iframe-container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 0;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 75vh;
            border: none;
            display: block;
            background-color: #ffffff;
        }

        @media (max-width: 600px) {
            .page-wrapper {
                padding: 12px;
            }

            h1 {
                font-size: 22px;
            }

            .top-panel {
                padding: 16px;
            }

            .lesson-nav button {
                width: 100%;
            }

            iframe {
                height: 72vh;
            }
        }
    </style>
</head>
<body>

<div class="page-wrapper">

    <section class="top-panel">
        <div class="top-row">
            <h1>2.1 Алфавіт та лексеми мов C/C++</h1>
            <a href="2.html" class="back-button">← Назад до модуля 2</a>
        </div>

        <nav class="lesson-nav">
            <button type="button" class="active" onclick="navigate('2_1_1.html', this)">Крок 1</button>
            <button type="button" onclick="navigate('2_1_2.html', this)">Крок 2</button>
            <button type="button" onclick="navigate('2_1_3.html', this)">Крок 3</button>
        </nav>
    </section>

    <section class="iframe-container">
        <iframe id="contentFrame" src="2_1_1.html"></iframe>
    </section>

</div>

<script>
    const frame = document.getElementById('contentFrame');

    function applyIframeStyles() {
        const iframe = document.getElementById('contentFrame');
        const doc = iframe.contentDocument || iframe.contentWindow.document;

        if (!doc) return;

        /*
            Якщо у фрагменті немає head/body,
            браузер усе одно створить їх автоматично.
        */

        const style = doc.createElement('style');

        style.textContent = `
            html {
                font-size: 150%;
            }

            body {
                font-family: Arial, sans-serif;
                color: #222;
                background-color: #ffffff;
                line-height: 1.65;
                padding: 32px;
                margin: 0;
                box-sizing: border-box;
            }

            p {
                margin: 0 0 1em 0;
            }

            ul, ol {
                margin: 0 0 1em 1.5em;
                padding: 0;
            }

            li {
                margin-bottom: 0.5em;
            }

            strong {
                color: #000;
            }

            code, pre {
                font-family: Consolas, Monaco, monospace;
                background-color: #f1f3f5;
                border-radius: 4px;
            }

            code {
                padding: 2px 5px;
            }

            pre {
                padding: 16px;
                overflow-x: auto;
                line-height: 1.45;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin: 1em 0;
            }

            th, td {
                border: 1px solid #ccc;
                padding: 8px 10px;
            }

            th {
                background-color: #f1f3f5;
            }

            @media (max-width: 600px) {
                html {
                    font-size: 125%;
                }

                body {
                    padding: 20px;
                }
            }
        `;

        doc.head.appendChild(style);
    }

    frame.addEventListener('load', applyIframeStyles);

    function navigate(page, button) {
        frame.src = page;

        const buttons = document.querySelectorAll('.lesson-nav button');
        buttons.forEach(btn => btn.classList.remove('active'));

        if (button) {
            button.classList.add('active');
        }
    }
</script>

</body>
</html>
